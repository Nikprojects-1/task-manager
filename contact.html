<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - TaskFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header><nav class="container"><ul class="nav-links"></ul></nav></header>
    <main class="container">
        <section class="page-hero-banner">
            <h1>Contact Us</h1>
            <p>Have questions? Our team is here to help you get the most out of TaskFlow.</p>
        </section>
        <div class="grid grid-2">
            <div class="content-card contact-form">
                <h2>Send a message</h2>
                <form onsubmit="event.preventDefault(); alert('Message sent! We will reply within 24 hours.');">
                    <div class="form-group">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" placeholder="Your name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="you@company.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Subject</label>
                        <select class="form-control form-select">
                            <option>General inquiry</option>
                            <option>Technical support</option>
                            <option>Billing</option>
                            <option>Enterprise sales</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" rows="5" placeholder="How can we help?" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Send Message</button>
                </form>
            </div>
            <div>
                <div class="info-tile" style="margin-bottom:1rem;">
                    <h3><i class="fas fa-envelope" style="color:var(--primary);"></i> Email</h3>
                    <p>support@taskflow.com</p>
                </div>
                <div class="info-tile" style="margin-bottom:1rem;">
                    <h3><i class="fas fa-phone" style="color:var(--success);"></i> Phone</h3>
                    <p>+1 (800) 555-0199 — Mon–Fri, 9am–6pm EST</p>
                </div>
                <div class="info-tile">
                    <h3><i class="fas fa-location-dot" style="color:var(--secondary);"></i> Office</h3>
                    <p>100 Productivity Lane, Suite 200<br>San Francisco, CA 94105</p>
                </div>
            </div>
        </div>
    </main>
    <footer class="site-footer"></footer>
    <script src="layout.js"></script>
</body>
</html>
